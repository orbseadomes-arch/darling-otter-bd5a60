<!DOCTYPE html>
<html>
  <body>
    <!-- Static skeleton so Netlify registers the form at build time. Never shown to users. -->
    <form name="orbsea-enquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="first-name" />
      <input type="text" name="last-name" />
      <input type="email" name="email" />
      <input type="text" name="enquiry-type" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
